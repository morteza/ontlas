apply plugin: 'java'
apply plugin: 'maven'
apply plugin: 'eclipse'

group = 'ir.onto'
version = '0.0.1'

description = """Ontology-driven Atlas"""

sourceCompatibility = 1.8
targetCompatibility = 1.8

repositories {

     maven { url "http://repo.maven.apache.org/maven2" }
}

dependencies {
    compile group: 'io.vertx', name: 'vertx-core', version:'3.3.2'
    compile group: 'io.vertx', name: 'vertx-mongo-client', version:'3.3.2'
    compile group: 'io.vertx', name: 'vertx-web', version:'3.3.2'
    compile group: 'net.sourceforge.owlapi', name: 'owlapi-api', version:'5.0.2'
    compile group: 'net.sourceforge.owlapi', name: 'owlapi-apibinding', version:'5.0.2'
    compile group: 'org.slf4j', name: 'slf4j-simple', version: '1.7.21'
    testCompile group: 'junit', name: 'junit', version:'4.12'
    testCompile group: 'io.vertx', name: 'vertx-unit', version:'3.3.2'
}
