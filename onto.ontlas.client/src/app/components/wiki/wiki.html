<md-toolbar class="md-table-toolbar md-default">
  <div class="md-toolbar-tools">
    <span>{{$ctrl.documents.title}}</span>
    <div flex></div>
    <md-button class="md-icon-button" ui-sref="queries/home" title="سرویس‌های مبتنی بر دانش">
      <md-icon>youtube_searched_for</md-icon>
    </md-button>
    <md-button class="md-icon-button" ui-sref="search/home" title="جستجوی دانش">
      <md-icon>search</md-icon>
    </md-button>
    <md-button class="md-icon-button" ng-click="$ctrl.getDocuments()" title="بازیابی مجدد این صفحه">
      <md-icon>refresh</md-icon>
    </md-button>
  </div>
</md-toolbar>

<md-content layout="column" layout-padded>
  <div flex class="md-padding md-body-1">
    {{$ctrl.documents.description}}
  </div>

  <div layout="row">
    <div flex="33" layout="column" ng-repeat="col in [0,1,2]">
    <md-card ng-repeat="document in $ctrl.documents.data" ng-if="$index%3==col">
      <md-card-header>
        <md-card-header-text>
          <a ui-sref="wiki({iri:document.iri})" class="md-headline" ng-if="document.id===undefined">{{document.title}}</a>
          <a ui-sref="cms/edit({id:document.id})" class="md-headline" ng-if="document.id">{{document.title}}</a>
          <span class="md-subhead">{{document.iri}}</span>
        </md-card-header-text>
      </md-card-header>
      <md-card-content>
          <p md-truncate ng-bind-html="document.description"></p>
      </md-card-content>
    </md-card>
    </span>
  </div>
</md-content>
