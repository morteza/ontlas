<md-toolbar class="md-table-toolbar md-default">
  <div class="md-toolbar-tools">
    <span>سرویس‌های مبتنی بر دانش</span>
    <div flex></div>
    <md-button class="md-icon-button" ui-sref="wiki/home">
      <md-icon>arrow_back</md-icon>
    </md-button>
  </div>
</md-toolbar>

<md-content layout="column" layout-wrap ng-if="$ctrl.results.data">
  <md-progress-linear md-mode="indeterminate" ng-if="$ctrl.isLoading"></md-progress-linear>
  <div ng-repeat="result in $ctrl.results.data" ng-if="!$ctrl.showDetails">
    <md-card flex>
      <md-card-header>
        <md-card-header-text class="md-title">
          <a ui-sref="cms/edit({id:result.id})" ng-if="result.id">{{ result.title }}</a>
          <a ui-sref="queries({iri:result.iri})" ng-if="result.iri && !result.id">{{ result.title }}</a>
        </md-card-header-text>
      </md-card-header>
      <md-card-content class="md-body-1" ng-if="result.description">
        {{ result.description | limitToWords: 30}}
      </md-card-content>
      <md-card-content class="md-body-1" ng-if="result.content">
        {{ result.content | limitToWords: 30}}
      </md-card-content>
    </md-card>
  </div>
  <div ng-if="$ctrl.showDetails">
    <h1>{{$ctrl.title}}</h1>
    <p>{{$ctrl.description}}</p>
    <h3>دانش مرتبط</h3>
    <md-list>
      <md-list-item ng-repeat="res in $ctrl.results.data">
        <div class="md-list-item-text">
          <a ui-sref="wiki({iri:res.iri})">{{res.title}}</a>
        </div>
      </md-list-item>
    </md-list>
  </div>
</md-content>
