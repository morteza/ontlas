<md-toolbar class="md-table-toolbar md-default">
  <div class="md-toolbar-tools">
    <span>کاربران</span>
  </div>
</md-toolbar>

<div ng-show="" permission="">ASDS</div>
<md-table-container>
  <table md-table>
    <thead md-head>
      <tr md-row>
        <th md-column><span>پست الکترونیکی</span></th>
        <th md-column>نام کاربر</th>
      </tr>
    </thead>
    <tbody md-body>
      <tr md-row ng-repeat="account in $ctrl.accounts">
        <td md-cell>{{account.email}}</td>
        <td md-cell>{{account.name}}</td>
      </tr>
    </tbody>
  </table>
</md-table-container>
