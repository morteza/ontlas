<h1 class="ui header">
  {{label}}
</h1>
<div class="ui basic segment">
  <span ng-repeat="class in subClasses">
    <a href="#!/wiki/{{class.class}}">{{ class.label }}</a><br />
  </span>
</div>

<div class="ui basic segment" ng-repeat="post in posts">
  <h2 class="ui dividing header">{{ post.title }}</h2>
  <p>{{ post.content }}</p>
</div>
